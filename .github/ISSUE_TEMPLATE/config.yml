# 议题模板配置
#
# blank_issues_enabled: false
#   强制所有议题都从模板开始。空议题几乎总是缺少复现步骤或环境信息，
#   而补问这些信息的往返成本远高于让人先选一个模板。
blank_issues_enabled: false

contact_links:
  - name: 报告安全漏洞（请勿开公开 issue）
    url: https://github.com/laolaoshiren/auto-quant/security/advisories/new
    about: |
      安全漏洞请走私密渠道，不要使用议题区。
      本应用持有真实交易凭据，公开描述漏洞路径等于在修复前把利用方法交给所有人。
      首选 GitHub Security Advisories（本链接）；具体说明见仓库根目录的 SECURITY.md。

  - name: 使用问题与部署疑问
    url: https://github.com/laolaoshiren/auto-quant/discussions
    about: |
      「怎么配置」「为什么我的机器人不下单」这类问题请走 Discussions。
      议题区留给可复现的缺陷与功能建议。动手前请先读 README.md 与 docs/。

  - name: 贡献之前先读贡献指南
    url: https://github.com/laolaoshiren/auto-quant/blob/main/CONTRIBUTING.md
    about: |
      分支模型、提交信息规范、测试要求，以及——最重要的——涉及真实资金的改动
      需要验证到哪一级。涉及下单路径的 PR 不得仅凭 typecheck 通过就合并。
