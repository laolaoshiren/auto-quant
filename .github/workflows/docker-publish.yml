# =============================================================================
# 构建并推送 Docker 镜像到 GitHub Container Registry
#
#   push 到 main（且 CI 通过）→ ghcr.io/<owner>/auto-quant:latest
#   推送 v* 标签           → 同时打上语义化版本标签
#
# -----------------------------------------------------------------------------
# 为什么用 workflow_run 而不是 on: push
# -----------------------------------------------------------------------------
# 直接用 `on: push` 会让镜像与检查**并行**开始构建：CI 还在跑，镜像可能已经推上去了。
# 一旦那次提交的测试失败，产物就已经在仓库里，而服务器可能已经拉到它并部署了。
#
# `workflow_run` 让本工作流在 CI **完成之后**才启动，并且用
# `conclusion == 'success'` 卡住：**只有通过全部检查的提交才会产出镜像**。
# 这是"镜像永远可部署"这条保证的实现方式。
#
# ⚠️ workflow_run 有一个已知细节：它在默认分支的上下文里运行，且
#    `github.sha` 指向默认分支的最新提交而不是触发它的那次提交。
#    所以下面用 `github.event.workflow_run.head_sha` 取真正被验证的那个提交。
# =============================================================================
name: Docker 镜像

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CI 成功才构建；手动触发与标签推送不受此限。
    #
    # ⚠️ 第二个条件是这个工作流的**安全闸门**，不要删。
    #
    # 本工作流运行在默认分支的上下文里，却持有 `packages: write`，
    # 并且会用 `head_sha` 检出**触发它的那次提交的代码**。对 PR 触发的
    # CI 来说，那就是**外部贡献者的代码**。
    #
    # 没有这个判断时的攻击链：fork 仓库 → 建一个**名叫 `main`** 的分支 →
    # 向上游开 PR。`on.workflow_run.branches` 按触发运行的 **head branch 名**
    # 过滤，而这个名字由 PR 作者随便起，于是过滤形同虚设；接着本工作流
    # 检出 fork 的提交、`docker build`（`npm ci` 的 postinstall 即任意代码
    # 执行）、再用仓库令牌推镜像，`:latest` 被覆盖。自托管者跑 `./up.sh`
    # 就会把攻击者的代码拉进**放着 data/（主密钥 + 交易所凭据）的容器**里。
    #
    # 所以：只信任来自本仓库自身的运行。fork 的 CI 仍然会跑（贡献者能看到
    # 检查结果），但**永远不会产出镜像**。
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))

    steps:
      # 取真正通过检查的那个提交，而不是默认分支的最新提交。
      #
      # 上面的 if 已经保证这个 sha 来自本仓库；这里再断言一次，
      # 是为了让"只检出本仓库代码"这件事在**这里**也读得出来 ——
      # 安全条件散落在两处时，后来的人删掉其中一处不会觉得有问题。
      - name: 断言代码来自本仓库
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          head_repo='${{ github.event.workflow_run.head_repository.full_name }}'
          if [ "$head_repo" != '${{ github.repository }}' ]; then
            echo "::error::拒绝构建来自 $head_repo 的代码（本仓库是 ${{ github.repository }}）"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成标签与 OCI 元数据。
      # 默认会打上 sha-<短哈希>，所以任何一次部署都能追溯到确切的提交。
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `:latest` 只在 main 上产出。
            #
            # 这里不用 `{{is_default_branch}}`：在 workflow_run 上下文里
            # `github.ref` 指的是**默认分支**，那是个恒为真的条件，
            # 读代码的人会以为它真的判断了"这次运行是不是 main"。
            # 显式比较 head_branch，条件与实际含义一致。
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 目前只构建 amd64 —— 部署目标是 x86_64 服务器。
          # 需要 ARM 时在这里加 linux/arm64（会启用 QEMU，构建时间显著变长）。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存放在 Actions 缓存里，重复构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 把提交信息写进镜像标签，便于从镜像反查来源
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 输出结果
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "提交: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在服务器上执行 \`./up.sh\` 即可部署这个镜像。" >> "$GITHUB_STEP_SUMMARY"
