# =============================================================================
# 构建并推送 Docker 镜像到 GitHub Container Registry
#
#   push 到 main  → ghcr.io/<owner>/auto-quant:latest
#   推送 v* 标签  → 同时打上语义化版本标签
#
# 这个镜像是 [`deploy/up.sh`](../deploy/up.sh) 一键部署的来源 —— 服务器上
# `docker compose up` 拉的就是它。**所以它不能删**，否则一键安装会失效。
#
# -----------------------------------------------------------------------------
# 为什么不再等 CI（2026-09-30 改）
# -----------------------------------------------------------------------------
# 原来这里是 `on: workflow_run: workflows: ["CI"]`，即"CI 通过之后才构建镜像"。
# 那套设计对**多人协作的公开项目**是对的：镜像永远可部署。
#
# 但它有两个代价，而本仓库现在只是单人维护：
#   1. 每 push 一次就跑一整套 CI（装依赖、跑测试、构建前端）；
#   2. **本工作流依赖 CI 存在** —— 一旦 CI 被拿掉，`workflow_run` 永不触发，
#      镜像也就永远不再产出，而这一点不会报错，只会安静地不再更新。
#
# 用户 2026-09-30 的指示：「github 上那些自动化功能能不用的就不要用了，
# 反正项目现在也就我自己在维护使用」。于是：
#   · 触发改成直接的 `push: branches: [main]`；
#   · 原来的 `workflow_run` 上下文（以及为它写的那套 fork 安全闸门）不再需要 ——
#     `push` 事件只可能由本仓库的写入者触发，没有"外部贡献者的代码"这条路径；
#   · 质量把关回到本地：`npm run typecheck / lint / test`（779 个用例）+ `npm run build`，
#     部署脚本 `scripts/deploy.ps1` 也仍然照旧走 scp/ssh，不经过 GitHub。
# =============================================================================
name: Docker 镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成标签与 OCI 元数据。
      # 默认会打上 sha-<短哈希>，所以任何一次部署都能追溯到确切的提交。
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `:latest` 跟着每次 main 的推送走（触发条件已经限定了 main 与 v* 标签，
            # 所以这里不需要再判断分支）。
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 目前只构建 amd64 —— 部署目标是 x86_64 服务器。
          # 需要 ARM 时在这里加 linux/arm64（会启用 QEMU，构建时间显著变长）。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存放在 Actions 缓存里，重复构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 把提交信息写进镜像标签，便于从镜像反查来源
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: 输出结果
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "提交: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在服务器上执行 \`./up.sh\` 即可部署这个镜像。" >> "$GITHUB_STEP_SUMMARY"
