# =============================================================================
# 首次贡献者的欢迎信息
#
# 只说两件对方此刻真的需要知道的事：
#   · 提 issue 的人需要知道该补哪些信息，否则问题无法复现；
#   · 提 PR 的人需要知道**这个项目会下真实订单** —— 一个没有上下文的贡献者
#     不可能从代码里看出这一点，而触及下单路径的改动有更高的验证门槛。
#
# 语气刻意保持平实：本项目的文档是精确、就事论事的，
# 用热情过头的欢迎辞会让后面那些硬性要求显得像是可以商量的。
#
# -----------------------------------------------------------------------------
# 这里用 pull_request_target，与 pr-labeler.yml 的选择不同，理由如下
# -----------------------------------------------------------------------------
# 这个工作流只发一条评论，既不检出 PR 代码、也不执行任何来自 PR 的内容，
# 因此 pull_request_target 带来的风险在这里不存在。
# 而它带来的差别是实打实的：用 pull_request 时，来自 fork 的 PR 只拿到只读 token，
# 而"第一次提 PR 的人"几乎必然来自 fork —— 那样这条欢迎信息恰恰在唯一需要它的
# 场景下不会发出。
#
# 如果将来要在本文件里加入任何会执行 PR 内容的步骤，必须先把触发器改回 pull_request。
# =============================================================================
name: 欢迎首次贡献者

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# 最小权限：只需要在 issue / PR 下写一条评论。
permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: 回复首次贡献者
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            感谢你提出第一个 issue。

            为了让问题能被复现，而不是靠来回追问，请尽量按模板补齐这些信息：

            - 期望行为与实际行为
            - 复现步骤，以及能否稳定复现
            - 运行方式：模拟盘还是实盘、`DRY_RUN` 取值、是否为容器部署、版本标签
            - 相关的日志或交易所错误码（例如币安返回的 `-4120`）

            模板里要求的字段不是形式。交易系统的缺陷往往只在某一种运行方式下出现，
            少了环境信息就只能靠猜。

            想自己动手时：

            - `docs/DEVELOPMENT.md` —— 环境、命令、测试策略、调试方法、常见陷阱
            - `docs/MODULES.md` —— 逐文件职责，以及"要加一个新的 X 就改这里"的配方

            如果这是安全漏洞，请不要在公开 issue 里描述细节，改用 `SECURITY.md` 里的私密渠道。

          pr-message: |
            感谢你提交第一个 PR。

            动手之前请先读 `CONTRIBUTING.md`，其中「涉及真实资金的改动」一节
            **优先于那份文档里的其他所有内容**：

            本应用会自动在交易所下**真实订单**。凡是可能影响下单路径的改动
            （`packages/server/src/binance/`、`packages/server/src/risk/`、
            `packages/server/src/trader/`，以及 `packages/shared/src/strategy.ts` 里的风控配置），
            必须在 PR 描述里写清"涉及真实资金/下单路径"，并说明验证到了哪一级 ——
            单元测试只证明逻辑分支正确，只有实盘冒烟测试能证明交易所真的接受这些请求。
            类型检查通过，和订单能不能被接受没有关系。

            合并前的几个硬性要求：

            - PR 标题符合 Conventional Commits（CI 会校验；squash 合并后它就是主分支的提交记录）
            - `npm run typecheck` 与 `npm test` 通过
            - 行为变更带测试；修 bug 的 PR 带一个"没有修复就会失败"的测试
            - PR 模板里的字段都填了，尤其是「是否涉及真实资金」一节

            不确定某处该改哪个文件，先看 `docs/MODULES.md`。
