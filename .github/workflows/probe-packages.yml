name: 探测包接口

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 逐个试接口，看 GITHUB_TOKEN 到底能碰到哪些
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          owner='${{ github.repository_owner }}'
          repo='${{ github.repository }}'

          try() {
            local label="$1"; shift
            printf '\n=== %s\n' "$label"
            printf '    %s\n' "$*"
            local out
            out=$("$@" 2>&1) && { printf '    ✅ OK\n'; printf '%s\n' "$out" | head -6 | sed 's/^/       /'; } \
                              || { printf '    ✗ %s\n' "$(printf '%s' "$out" | head -2 | tr '\n' ' ')"; }
          }

          try "用户命名空间 · 列表（预期失败：App 令牌不是用户令牌）" \
            gh api "/users/$owner/packages?package_type=container"
          try "当前认证用户 · 列表" \
            gh api "/user/packages?package_type=container"
          try "仓库命名空间 · 单包" \
            gh api "/repos/$repo/packages/container/auto-quant"
          try "仓库命名空间 · 列表" \
            gh api "/repos/$repo/packages?package_type=container"
          try "仓库命名空间 · 版本列表" \
            gh api "/repos/$repo/packages/container/auto-quant/versions?per_page=1"
