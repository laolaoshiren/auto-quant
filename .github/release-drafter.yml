# =============================================================================
# 发布说明的配置（release-drafter v6）
#
# ## 这个文件管什么、不管什么
#
# 管：**分类归属**（按 PR 标签）与**版本号推导**。
# 不管：正文措辞 —— 正文由 `template` 决定，这里用**中文单板**。
#
# ## 为什么 2026-10-17 重写了正文
#
# 用户原话：「发版格式得重新好好设计编排，魔方 Magpie 官方那种写法，
# **不要英文，中文单板就行**」。
#
# 旧正文有三个问题：
# ① 「怎么升级」写的是 **Docker 镜像 + `./up.sh`** —— 而本项目的真实部署路径是
#    `scripts/deploy.ps1`（打包 + scp + ssh + systemctl restart），**根本没有 up.sh**；
# ② 用户看到的是「**No changes**」—— release-drafter 只按 **PR 标签**归类，
#    而本仓库长期是**直接推 commit、不开 PR**，于是一条都匹配不到；
# ③ 英文兜底与中文正文混排。
#
# ⇒ 现在的正文策略：
# · 正文只写用户**真正需要知道**的三件事：改了什么 / 要紧吗 / 怎么上；
# · 部署方式按**本仓库的真实路径**写，不写 Docker；
# · 提醒"部署会打断正在跑的一轮"，这是本项目的真实代价。
#
# 具体发版步骤见 docs/RELEASING.md。
# =============================================================================

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # 破坏性变更排在最前：升级服务器的人先看这一节，看完再决定升不升。
  - title: '💥 破坏性变更'
    labels: ['breaking']

  - title: '🚀 新功能'
    labels: ['enhancement']

  - title: '🐛 修复'
    labels: ['bug']

  - title: '⚡ 性能'
    labels: ['perf']

  - title: '📚 文档'
    labels: ['docs']

  - title: '⬆️ 依赖更新'
    labels: ['dependencies']
    # Dependabot 每周成批开 PR，不折叠会把其他内容挤出屏幕。
    collapse-after: 5

  # 没有 labels 的那一个分类接住其余全部改动（refactor / test / chore / ci…）。
  # 它必须存在：否则这些改动会从发布说明里消失，而"这次发布到底改了什么"
  # 就不再能从发布说明回答。
  - title: '🔧 其他'

# 版本号由标签推导，不靠人记 —— PR 阶段已经打好的类型标签同时决定版本增量。
#
# 这里**故意没有 major**：pre-1.0 阶段破坏性变更按 semver 的规定走 minor 递增，
# 而"这次破坏性变更够不够格升到 1.0"是产品决策，不该由一次自动标签替人做决定。
version-resolver:
  minor:
    labels: ['breaking', 'enhancement']
  patch:
    labels: ['bug', 'perf', 'docs', 'dependencies']
  default: patch

# 每条改动一行。PR 号在前便于反查；标题里若含 markdown 字符要转义，
# 否则一个标题里的 `*` 就能把整段发布说明的排版弄乱。
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  $CHANGES

  ---

  ## 怎么升级

  线上部署走 `scripts/deploy.ps1`（打包 → scp 上传 → systemctl 重启），
  **不是 Docker 镜像**。在仓库根目录执行：

  ```powershell
  pwsh -File scripts/deploy.ps1
  ```

  脚本会在三处拦住你：工作树不干净（`-AllowDirty` 可强制放行）、
  本地验证没过、回读的 `commitShort` 与本地 HEAD 对不上。

  > ⚠️ 这个项目下的是**真实订单**。升级前先看最上面「破坏性变更」一节，
  > 确认这次升级没有要求改配置或迁移数据。

  > 🔁 部署会重启服务，而重启会**打断正在跑的那一轮决策**
  > （一轮最长约 36 分钟，而排空只等 3 分钟）。
  > 挑在没有轮次在跑的窗口升级，或接受"这一轮的审计记录不完整"。
